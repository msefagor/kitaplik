<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>101 Tabela MSEFAGOR</title>
    <style>
        :root {
            /* Liquid Glass Palette */
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shine: rgba(255, 255, 255, 0.05);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            
            --text-color: #ffffff;
            --accent-color: #f1c40f;
            --danger-color: #ff6b81;
            --blue-color: #1e90ff;
            --siler-color: #7bed9f;
            
            --biz-color: #00cec9;
            --siz-color: #fab1a0;

            --tile-bg: linear-gradient(145deg, #ffffff, #e6e6e6);
            --tile-ink: #2d3436;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: linear-gradient(135deg, #093028, #237a57, #093028);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            display: flex; flex-direction: column;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        header {
            padding: 40px 15px 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            margin-bottom: 10px;
        }
        
        h1 { margin: 0; font-size: 18px; font-weight: 800; }
        
        .header-actions { display: flex; gap: 8px; align-items: center; }

        .timer-badge {
            background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 20px;
            font-family: monospace; font-weight: bold; color: var(--accent-color);
            border: 1px solid var(--glass-border);
        }

        .settings-btn {
            background: rgba(255,255,255,0.15); 
            border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 8px 16px; border-radius: 25px; font-size: 13px; font-weight: 600;
        }

        /* Table Structure */
        .game-container { flex: 1; overflow-y: auto; padding-bottom: 140px; }
        
        .grid-header {
            display: grid; grid-template-columns: 1.3fr 1.3fr 1fr 1fr 1.4fr 1.2fr;
            padding: 15px 5px; font-size: 11px; font-weight: 900; text-align: center;
            background: rgba(0,0,0,0.25); margin: 0 10px; border-radius: 15px;
            text-transform: uppercase; border: 1px solid var(--glass-border);
        }

        .game-row {
            display: grid; grid-template-columns: 1.3fr 1.3fr 1fr 1fr 1.4fr 1.2fr;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            min-height: 65px; margin: 5px 10px; border-radius: 12px;
        }

        .cell {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 4px; font-size: 17px; font-weight: 600; text-align: center;
        }

        .score-val { font-size: 19px; font-weight: 700; }
        .siler-icons { color: var(--siler-color); font-size: 18px; line-height: 10px; display: flex; flex-direction: column; }
        
        .penalty-tag { font-size: 10px; padding: 3px 6px; border-radius: 8px; margin: 2px; font-weight: 800; }
        .penalty-tag.tek { background: var(--blue-color); }
        .penalty-tag.cift { background: var(--danger-color); }

        /* Footer */
        .footer-totals {
            position: fixed; bottom: 0; left: 0; right: 0; height: 110px;
            background: rgba(15, 20, 25, 0.85); backdrop-filter: blur(25px);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: 20px; z-index: 60; border-top: 1px solid rgba(255,255,255,0.15);
        }
        
        .total-score { font-size: 26px; font-weight: 800; }

        .status-wrapper {
            position: relative; width: 120px; height: 80px;
            background: #2d3436; border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #scratch-canvas { position: absolute; top: 0; left: 0; z-index: 10; touch-action: none; }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #1e272e; width: 90%; max-width: 400px;
            border-radius: 24px; padding: 20px; border: 1px solid var(--glass-border);
        }

        .player-score-group {
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 10px;
        }
        
        .score-input-wrapper { display: flex; flex-direction: column; gap: 8px; }
        
        input[type="number"] {
            width: 100%; background: #000; border: 1px solid #444; color: #fff;
            font-size: 24px; text-align: center; padding: 10px; border-radius: 10px;
        }

        .multiplier-group { display: flex; gap: 5px; }
        .m-btn {
            flex: 1; padding: 8px; border: none; border-radius: 8px; 
            background: #333; color: #fff; font-weight: bold; font-size: 12px;
        }
        .m-btn.active { background: var(--accent-color); color: #000; }

        .action-btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            margin-top: 10px; font-weight: 700; cursor: pointer;
        }
        .save-btn { background: var(--siler-color); color: #000; }

    </style>
</head>
<body>

    <header class="glass-panel">
        <h1 id="main-title">101 MSEFAGOR (11)</h1>
        <div class="header-actions">
            <div class="timer-badge" id="game-timer">00:00</div>
            <button class="settings-btn" onclick="openPlayersModal()">Ayarlar</button>
        </div>
    </header>

    <div class="grid-header glass-panel">
        <div>Biz<br>Oyun</div>
        <div>Siz<br>Oyun</div>
        <div>Biz<br>Ceza</div>
        <div>Siz<br>Ceza</div>
        <div>Dağ.</div>
        <div>Fark</div>
    </div>

    <div class="game-container" id="game-rows"></div>

    <div class="footer-totals">
        <div class="total-box" style="text-align: center;">
            <div style="font-size:10px; opacity:0.6">BİZ</div>
            <div class="total-score" id="total-biz" style="color:var(--biz-color)">0</div>
        </div>
        
        <div class="status-wrapper">
            <div id="result-content" style="text-align:center; z-index:1"></div>
            <canvas id="scratch-canvas"></canvas>
        </div>

        <div class="total-box" style="text-align: center;">
            <div style="font-size:10px; opacity:0.6">SİZ</div>
            <div class="total-score" id="total-siz" style="color:var(--siz-color)">0</div>
        </div>
    </div>

    <div id="score-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title" style="text-align:center; margin-top:0;">Puan Girişi</h3>
            
            <div class="player-score-group">
                <div style="font-size:12px; margin-bottom:5px; color:var(--accent-color)" id="p-label-1">Oyuncu 1</div>
                <div class="score-input-wrapper">
                    <input type="number" id="sc-1" placeholder="0">
                    <div class="multiplier-group">
                        <button class="m-btn active" id="m1-1" onclick="setMultiplier(1, 1)">DÜZ x1</button>
                        <button class="m-btn" id="m1-2" onclick="setMultiplier(1, 2)">ÇİFT x2</button>
                    </div>
                </div>
            </div>

            <div class="player-score-group">
                <div style="font-size:12px; margin-bottom:5px; color:var(--accent-color)" id="p-label-2">Oyuncu 2</div>
                <div class="score-input-wrapper">
                    <input type="number" id="sc-2" placeholder="0">
                    <div class="multiplier-group">
                        <button class="m-btn active" id="m2-1" onclick="setMultiplier(2, 1)">DÜZ x1</button>
                        <button class="m-btn" id="m2-2" onclick="setMultiplier(2, 2)">ÇİFT x2</button>
                    </div>
                </div>
            </div>

            <div style="display:flex; justify-content:center; gap:10px; margin: 10px 0;">
                <button class="m-btn" style="background:var(--danger-color)" onclick="addSilerModal(1)">Siler +</button>
                <div id="modal-siler-count" style="color:var(--siler-color); font-weight:bold; font-size:20px;"></div>
                <button class="m-btn" onclick="addSilerModal(-1)">Siler -</button>
            </div>

            <button class="action-btn save-btn" onclick="applyAdvancedScore()">KAYDET</button>
            <button class="action-btn" style="background:transparent; color:#888" onclick="closeModals()">İptal</button>
        </div>
    </div>

    <div id="penalty-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="text-align:center;">Ceza Ekle</h3>
            <div class="toggle-container" style="display:flex; gap:10px; margin-bottom:15px;">
                <button class="m-btn active" id="btn-tek" style="padding:15px" onclick="setPenaltyMode('tek')">TEK (x10)</button>
                <button class="m-btn" id="btn-cift" style="padding:15px" onclick="setPenaltyMode('cift')">ÇİFT (x20)</button>
            </div>
            <div class="num-grid" id="num-grid-container" style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;"></div>
            <div id="penalty-list-container" style="display:flex; flex-wrap:wrap; gap:5px; margin-top:15px;"></div>
            <button class="action-btn" style="background:#444; color:#fff" onclick="closeModals()">Kapat</button>
        </div>
    </div>

    <div id="players-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="text-align:center;">Oyuncular</h3>
            <input type="text" id="p1" placeholder="Oyuncu 1"><br>
            <input type="text" id="p2" placeholder="Oyuncu 2"><br>
            <input type="text" id="p3" placeholder="Oyuncu 3"><br>
            <input type="text" id="p4" placeholder="Oyuncu 4"><br>
            <button class="action-btn save-btn" onclick="savePlayers()">Kaydet</button>
            <button class="action-btn" style="background:var(--danger-color); color:#fff" onclick="resetGame()">Sıfırla</button>
            <button class="action-btn" onclick="closeModals()">Kapat</button>
        </div>
    </div>

    <script>
        let players = ["Sefa", "Fatih", "Halil", "İlker"];
        let gameData = [];
        let activeRow = 0;
        let activeColType = '';
        let mult1 = 1, mult2 = 1, tempSiler = 0;
        let timerInterval = null;
        let startTime = null;

        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');

        window.onload = function() {
            initGameData();
            loadFromStorage();
            renderTable();
            createNumGrid();
            initScratch();
        };

        function initGameData() {
            gameData = Array.from({length: 11}, () => ({
                bizScore: { val: 0, siler: 0 },
                sizScore: { val: 0, siler: 0 },
                bizCeza: [], sizCeza: []
            }));
        }

        // --- TIMER LOGIC ---
        function startTimer() {
            if (timerInterval) return;
            startTime = Date.now();
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }

        function updateTimerDisplay() {
            const now = Date.now();
            const diff = Math.floor((now - startTime) / 1000);
            const m = Math.floor(diff / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            document.getElementById('game-timer').innerText = `${m}:${s}`;
        }

        // --- SCORE LOGIC ---
        function openScoreModal(row, type) {
            activeRow = row;
            activeColType = type;
            const isBiz = type === 'bizScore';
            
            document.getElementById('p-label-1').innerText = isBiz ? players[0] : players[1];
            document.getElementById('p-label-2').innerText = isBiz ? players[2] : players[3];
            
            document.getElementById('sc-1').value = '';
            document.getElementById('sc-2').value = '';
            mult1 = 1; mult2 = 1;
            tempSiler = gameData[row][type].siler;
            
            updateMultiplierUI();
            updateSilerUI();
            document.getElementById('score-modal').style.display = 'flex';
        }

        function setMultiplier(playerNum, m) {
            if(playerNum === 1) mult1 = m; else mult2 = m;
            updateMultiplierUI();
        }

        function updateMultiplierUI() {
            document.getElementById('m1-1').className = mult1 === 1 ? 'm-btn active' : 'm-btn';
            document.getElementById('m1-2').className = mult1 === 2 ? 'm-btn active' : 'm-btn';
            document.getElementById('m2-1').className = mult2 === 1 ? 'm-btn active' : 'm-btn';
            document.getElementById('m2-2').className = mult2 === 2 ? 'm-btn active' : 'm-btn';
        }

        function addSilerModal(delta) {
            tempSiler = Math.max(0, tempSiler + delta);
            updateSilerUI();
        }

        function updateSilerUI() {
            document.getElementById('modal-siler-count').innerText = "∞ ".repeat(tempSiler);
        }

        function applyAdvancedScore() {
            const s1 = parseInt(document.getElementById('sc-1').value) || 0;
            const s2 = parseInt(document.getElementById('sc-2').value) || 0;
            
            gameData[activeRow][activeColType].val = (s1 * mult1) + (s2 * mult2);
            gameData[activeRow][activeColType].siler = tempSiler;
            
            startTimer(); // İlk veri girişinde süreyi başlat
            closeModals();
            renderTable();
        }

        // --- RENDER & STORAGE ---
        function renderTable() {
            const container = document.getElementById('game-rows');
            container.innerHTML = '';
            let bizT = 0, sizT = 0, played = 0;

            gameData.forEach((row, i) => {
                const bS = row.bizScore.val + (row.bizScore.siler * -100) + row.bizCeza.reduce((a,b)=>a+(b.val||0),0);
                const sS = row.sizScore.val + (row.sizScore.siler * -100) + row.sizCeza.reduce((a,b)=>a+(b.val||0),0);
                
                bizT += bS; sizT += sS;
                if(row.bizScore.val !== 0 || row.sizScore.val !== 0 || row.bizCeza.length > 0 || row.sizCeza.length > 0) played++;

                const html = `
                    <div class="game-row">
                        <div class="cell" onclick="openScoreModal(${i}, 'bizScore')">
                            <span class="score-val">${row.bizScore.val || '-'}</span>
                            <div class="siler-icons">${'∞'.repeat(row.bizScore.siler)}</div>
                        </div>
                        <div class="cell" onclick="openScoreModal(${i}, 'sizScore')">
                            <span class="score-val">${row.sizScore.val || '-'}</span>
                            <div class="siler-icons">${'∞'.repeat(row.sizScore.siler)}</div>
                        </div>
                        <div class="cell" onclick="openPenaltyModal(${i}, 'bizCeza')">
                            ${row.bizCeza.map(c=>`<span class="penalty-tag ${c.mode}">${c.val}</span>`).join('')}
                        </div>
                        <div class="cell" onclick="openPenaltyModal(${i}, 'sizCeza')">
                            ${row.sizCeza.map(c=>`<span class="penalty-tag ${c.mode}">${c.val}</span>`).join('')}
                        </div>
                        <div class="cell" style="font-size:10px; opacity:0.5">${players[i%4]}</div>
                        <div class="cell" style="font-weight:bold">${Math.abs(bS-sS)}</div>
                    </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });

            document.getElementById('total-biz').innerText = bizT;
            document.getElementById('total-siz').innerText = sizT;
            document.getElementById('main-title').innerText = `101 MSEFAGOR (${11-played})`;
            
            updateStatus(bizT, sizT);
            saveToStorage();
        }

        function updateStatus(b, s) {
            const res = document.getElementById('result-content');
            if(b < s) res.innerHTML = `<span style="color:var(--biz-color)">BİZ<br>${s-b} ÖNDE</span>`;
            else if(s < b) res.innerHTML = `<span style="color:var(--siz-color)">SİZ<br>${b-s} ÖNDE</span>`;
            else res.innerHTML = "EŞİT";
            initScratch(); // Her güncellemede kazı kazanı yenile
        }

        // --- PENALTY LOGIC ---
        let pMode = 'tek';
        function setPenaltyMode(m) {
            pMode = m;
            document.getElementById('btn-tek').className = m === 'tek' ? 'm-btn active' : 'm-btn';
            document.getElementById('btn-cift').className = m === 'cift' ? 'm-btn active' : 'm-btn';
        }

        function createNumGrid() {
            const g = document.getElementById('num-grid-container');
            for(let i=1; i<=13; i++) {
                let b = document.createElement('button');
                b.className = 'm-btn'; b.innerText = i;
                b.onclick = () => {
                    gameData[activeRow][activeColType].push({val: i*(pMode==='tek'?10:20), mode: pMode});
                    renderTable(); renderPenaltyList();
                };
                g.appendChild(b);
            }
        }

        function openPenaltyModal(row, type) {
            activeRow = row; activeColType = type;
            renderPenaltyList();
            document.getElementById('penalty-modal').style.display = 'flex';
        }

        function renderPenaltyList() {
            const c = document.getElementById('penalty-list-container');
            c.innerHTML = '';
            gameData[activeRow][activeColType].forEach((p, idx) => {
                let s = document.createElement('span');
                s.className = `penalty-tag ${p.mode}`;
                s.innerText = p.val + " x";
                s.onclick = () => { gameData[activeRow][activeColType].splice(idx,1); renderTable(); renderPenaltyList(); };
                c.appendChild(s);
            });
        }

        // --- UTILS ---
        function closeModals() { 
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); 
        }

        function openPlayersModal() {
            document.getElementById('p1').value = players[0];
            document.getElementById('p2').value = players[1];
            document.getElementById('p3').value = players[2];
            document.getElementById('p4').value = players[3];
            document.getElementById('players-modal').style.display = 'flex';
        }

        function savePlayers() {
            players = [
                document.getElementById('p1').value || "P1",
                document.getElementById('p2').value || "P2",
                document.getElementById('p3').value || "P3",
                document.getElementById('p4').value || "P4"
            ];
            closeModals(); renderTable();
        }

        function resetGame() {
            if(confirm("Sıfırlansın mı?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function saveToStorage() {
            localStorage.setItem('msefa_data', JSON.stringify(gameData));
            localStorage.setItem('msefa_players', JSON.stringify(players));
        }

        function loadFromStorage() {
            const d = localStorage.getItem('msefa_data');
            const p = localStorage.getItem('msefa_players');
            if(d) gameData = JSON.parse(d);
            if(p) players = JSON.parse(p);
        }

        // --- SCRATCH ENGINE ---
        function initScratch() {
            const w = canvas.parentNode.offsetWidth;
            const h = canvas.parentNode.offsetHeight;
            canvas.width = w; canvas.height = h;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#999'; ctx.fillRect(0,0,w,h);
            ctx.fillStyle = '#444'; ctx.font = "bold 12px sans-serif"; ctx.textAlign="center";
            ctx.fillText("KAZI", w/2, h/2+5);
            ctx.globalCompositeOperation = 'destination-out';
        }

        let drawing = false;
        canvas.addEventListener('touchstart', (e) => { drawing = true; scratch(e); });
        canvas.addEventListener('touchmove', (e) => { if(drawing) scratch(e); e.preventDefault(); });
        canvas.addEventListener('touchend', () => drawing = false);

        function scratch(e) {
            const rect = canvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            const x = t.clientX - rect.left;
            const y = t.clientY - rect.top;
            ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI*2); ctx.fill();
        }
    </script>
</body>
</html>
